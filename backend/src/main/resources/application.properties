spring.application.name=smartstock-ai
spring.config.import=optional:file:.env[.properties]

# Database configuration (Configured via DB_URL, DB_USERNAME, DB_PASSWORD environment variables)
# In production (Aiven MySQL): set DB_URL=jdbc:mysql://... and DB_USERNAME, DB_PASSWORD
# Default fallback allows immediate out-of-the-box local execution and health checks
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartstock_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=8080
