services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: live
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
